version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week after a release before proposing it (GitHub's default is
    # 3 days), so a broken or compromised release has time to be yanked.
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    # The reusable workflows in .github/workflows ship to every caller, and they share the directory
    # with this repository's local-*.yaml, so every bump is a fix(deps) that releases.
    commit-message:
      prefix: "fix(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

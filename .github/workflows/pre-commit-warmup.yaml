name: Pre-commit Cache Warm-up (reusable)

# Fills the pre-commit cache on the calling ref (the default branch) so that CI jobs restoring the
# same key start warm, then prunes the older entries it replaces. The cache key is
#
#   <cache_key_prefix>|<runner.os>|<resolved Python version>|<hash of .pre-commit-config.yaml>
#
# where the Python version is setup-python's `python-version` output for `python_version` (3.x
# resolves to, say, 3.14.0), because the hook environments are virtualenvs bound to the interpreter
# that built them. A CI job restores it with the same four parts (see pre-commit-warmup.md).
#
# The inline script is tested by scripts/test-pre-commit-warmup.sh, which extracts it with yq. Keep
# it self-contained: it reads its inputs from env only.
on:
  workflow_call:
    inputs:
      python_version:
        description: >-
          The Python for setup-python, such as `3.x` or `3.13`. Its resolved version is part of
          the cache key, so a CI job restoring the cache must set up the same one.
        type: string
        required: false
        default: "3.x"
      pre_commit_version:
        description: >-
          The pre-commit release to install, X.Y.Z. Keep it equal to the version CI installs.
        type: string
        required: false
        default: "4.6.2"
      cache_key_prefix:
        description: The first part of the cache key, before `|<runner.os>|`.
        type: string
        required: false
        default: "pre-commit"
      prune:
        description: >-
          Delete the older pre-commit caches of the calling ref after the warm-up. Needs
          `actions: write` on the calling job; without it the prune is skipped with a warning.
        type: boolean
        required: false
        default: true
      keep_caches:
        description: How many of the newest pre-commit caches of the calling ref to keep (>= 1).
        type: number
        required: false
        default: 2
    outputs:
      cache_key:
        description: The cache key the warm-up saved (or found), for a caller that wants to log it.
        value: ${{ jobs.warm-pre-commit-cache.outputs.cache_key }}

# No workflow-level permissions on purpose: the warm-up job declares its own, and the prune job runs
# with the calling job's grant (see the prune job).

concurrency:
  group: "${{ github.workflow }} @ ${{ github.repository }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  warm-pre-commit-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      cache_key: ${{ steps.key.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      # make test extracts this script by id (scripts/test-pre-commit-warmup.sh).
      - name: Install pre-commit
        id: install
        env:
          PRE_COMMIT_VERSION: ${{ inputs.pre_commit_version }}
        run: |
          set -euo pipefail
          # A pinned release only: the value becomes a pip requirement, so anything but X.Y.Z (an
          # empty value, a range, an option) is refused rather than handed to pip.
          if ! [[ "$PRE_COMMIT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid pre_commit_version::pre_commit_version must be X.Y.Z, got '$PRE_COMMIT_VERSION'."
            exit 1
          fi
          python -m pip install --disable-pip-version-check --no-cache-dir "pre-commit==$PRE_COMMIT_VERSION"
          pre-commit --version

      # One definition of the key, used by the save below and printed for the callers' CI to match.
      - name: Compute the cache key
        id: key
        env:
          KEY: ${{ inputs.cache_key_prefix }}|${{ runner.os }}|${{ steps.python.outputs.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}
        run: |
          set -euo pipefail
          echo "Cache key: $KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Cache pre-commit
        id: precommit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.key.outputs.key }}

      - name: Warm up hook environments
        if: steps.precommit.outputs.cache-hit != 'true'
        run: pre-commit install-hooks

  # Each change to .pre-commit-config.yaml (or to the resolved Python) saves a new cache entry, and
  # the old ones would sit in the repository's cache quota until GitHub evicts them. This keeps the
  # newest keep_caches entries of the calling ref under `<cache_key_prefix>|` and deletes the rest.
  # It runs after a failed warm-up too: the older entries are still the ones to go.
  #
  # Deleting a cache needs `actions: write`. The job deliberately declares no permissions and runs
  # with the calling job's grant: a nested job that requests a permission its caller does not grant
  # fails the whole run at startup, warm-up included, whatever its `if:` says, so declaring it here
  # would break every v1 caller that grants only `contents: read`. A caller without the grant gets a
  # warning and a skipped prune instead (prune-caches), and its warm-up behaves as before.
  prune:
    needs: warm-pre-commit-cache
    if: ${{ !cancelled() && inputs.prune }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete older pre-commit caches
        uses: leinardi/gh-composite-actions/prune-caches@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          ref: ${{ github.ref }}
          key-prefix: ${{ inputs.cache_key_prefix }}|
          keep: ${{ inputs.keep_caches }}

name: Pre-commit Cache Warm-up (reusable)

on:
  workflow_call:
    inputs:
      python_version:
        type: string
        required: false
        default: "3.x"
      cache_key_prefix:
        type: string
        required: false
        default: "pre-commit"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.repository }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  warm-pre-commit-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit

      - name: Cache pre-commit
        id: precommit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ inputs.cache_key_prefix }}|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Warm up hook environments
        if: steps.precommit.outputs.cache-hit != 'true'
        run: pre-commit install-hooks

name: Pre-commit Cache Warm-up

# Keeps a main-branch cache of the pre-commit hook environments for the pre-commit-all job in
# local-ci.yaml to restore under the same key (pre-commit|<OS>|<hash of .pre-commit-config.yaml>).
# The weekly schedule is eviction insurance: GitHub evicts a cache nobody restored for 7 days.
on:
  push:
    branches:
      - main
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/local-pre-commit-warmup.yaml
      - .github/workflows/pre-commit-warmup.yaml
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: pre-commit-warmup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm-pre-commit-cache:
    # The local file: the warm-up this repository publishes warms its own cache, and prunes it.
    # actions: write lets the prune job delete the older caches.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/pre-commit-warmup.yaml

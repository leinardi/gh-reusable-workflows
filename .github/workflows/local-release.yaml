name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.3.0 or v1.3.0 (empty: derive from the commits since the last release)"
        required: false
        type: string
      dry_run:
        description: "Dry run: resolve the version and print the plan, change nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    # The local file, not @v1: every release of this repository runs the
    # workflow it is about to publish.
    uses: ./.github/workflows/simple-tag-and-release.yaml
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}

name: Dependabot release (reusable)

# Releases a patch on its own when the push that merges a Dependabot pull request leaves nothing
# but Dependabot's work unreleased. For a repository whose callers run what it ships (actions,
# reusable workflows), so a pin bump reaches them without a human dispatching the release. It
# tags nothing: the caller's next job calls simple-tag-and-release with the `version` output when
# `release` is true, so that call is pinned in the caller like any other.
#
#   authorize  no checkout and no repository code: GitHub API calls only. The highest release tag
#              is an ancestor of the push, and every commit since it is Dependabot's: a commit it
#              authored (and GitHub verified), or the merge of one of its pull requests. At least
#              one is a `fix`; none is breaking (subject `!` or a footer). The version is that tag's
#              patch + 1.
#              The whole change must be action pins (and pre-commit revs), or version updates of
#              the `ecosystems` input's files (Dockerfile FROM lines, Cargo, Go modules, npm):
#              authorship rests on GitHub's attribution, which a commit can borrow, so what ships
#              is checked too. A re-run on the release commit itself finishes that release instead.
#   ci         require-ci-green on the pushed commit; then the pushed commit must still be the
#              default branch's head, since a newer push's run covers it too. Sets release=true.
#
# The caller must hold its push runs in one concurrency group for the whole workflow (see the .md):
# the version is picked here and published in the caller's next job, so two runs between those
# points would pick the same one.
#
# Anything else unreleased (a feat or fix merged by hand, a commit pushed to a Dependabot branch)
# is a green no-op with a notice: that release is a human's, dispatched as usual.
#
# The caller runs it on `push` to the default branch, next to its workflow_dispatch release.
#
# The inline scripts are tested by scripts/test-dependabot-release.sh, which extracts them from
# this file with yq. Keep each one self-contained: it reads its inputs from env only.
on:
  workflow_call:
    inputs:
      tag_prefix:
        description: "Text before X.Y.Z in a release tag: `v` for vX.Y.Z, `<plugin>--v` for <plugin>--vX.Y.Z"
        type: string
        required: false
        default: "v"
      ci_workflow:
        description: "The CI workflow file in .github/workflows that must have passed on the pushed commit"
        type: string
        required: false
        default: "ci.yaml"
      ecosystems:
        description: "Dependabot ecosystems whose updates may ship, besides action pins and pre-commit revs: space-separated, any of docker cargo gomod npm. Empty: action pins only"
        type: string
        required: false
        default: ""
    outputs:
      release:
        description: "true only when everything unreleased is Dependabot's and CI passed on it; otherwise empty"
        value: ${{ jobs.ci.outputs.release }}
      version:
        description: "The version to release, X.Y.Z; empty unless release is true"
        value: ${{ jobs.ci.outputs.version }}
      tag:
        description: "The tag to release, <tag_prefix>X.Y.Z; empty unless release is true"
        value: ${{ jobs.ci.outputs.tag }}

permissions:
  contents: read

# One at a time per repository and never cancelled: a run that started finishes. A newer push may
# replace a pending run, which is fine: its range holds the replaced push's commits too. A group of
# its own, so it does not deadlock with simple-tag-and-release's job group (release-<repo>).
concurrency:
  group: dependabot-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # API calls only: no checkout, no repository code. Every API error and every response that is not
  # what the API documents fails; everything that is simply not Dependabot's skips.
  authorize:
    # A cheap first filter, so an ordinary push spends no runner: the push must end in the merge of
    # a pull request from a dependabot/ branch. The step below checks it for real.
    if: >-
      github.event_name == 'push'
      && startsWith(github.event.head_commit.message, 'Merge pull request #')
      && contains(github.event.head_commit.message, '/dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # git/matching-refs, compare/.
      contents: read
      # commits/{sha}/pulls.
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      reconcile: ${{ steps.authorize.outputs.reconcile }}
      version: ${{ steps.authorize.outputs.version }}
      tag: ${{ steps.authorize.outputs.tag }}

    steps:
      - name: Check that everything unreleased is Dependabot's
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          ECOSYSTEMS: ${{ inputs.ecosystems }}
        run: |
          set -euo pipefail
          fail() {
            echo "$*" >&2
            exit 1
          }
          skip() {
            echo "::notice title=No Dependabot release::$*"
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # The association of a fresh merge commit with its pull request can lag the push, so an
          # empty list is read again a few times. Anything else is decided on the first read.
          ATTEMPTS="${AUTHORIZE_ATTEMPTS:-4}"
          DELAY="${AUTHORIZE_DELAY:-10}"
          BOT="dependabot[bot]"

          if [ "$EVENT" != "push" ] || [ -z "$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            fail "dependabot-release runs on a push to the default branch (${DEFAULT_BRANCH:-unknown}) only, got $EVENT on $REF. Nothing was released."
          fi
          if [ -z "$TAG_PREFIX" ] || ! [[ "$TAG_PREFIX" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            fail "tag_prefix '$TAG_PREFIX' must be non-empty and hold only letters, digits and '.', '_', '/', '-'. Nothing was released."
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            fail "The pushed SHA '$SHA' is not a full commit SHA. Nothing was released."
          fi
          # Split on any whitespace (a YAML block scalar ends in a newline), never globbed; jq gets
          # the validated words joined by single spaces.
          set -f
          # shellcheck disable=SC2206 # deliberate word splitting, globbing is off
          ECOSYSTEM_LIST=(${ECOSYSTEMS:-})
          set +f
          for ecosystem in "${ECOSYSTEM_LIST[@]}"; do
            case "$ecosystem" in
            docker | cargo | gomod | npm) ;;
            *) fail "ecosystems holds '$ecosystem'; it takes only docker, cargo, gomod and npm. Nothing was released." ;;
            esac
          done
          ECOSYSTEMS="${ECOSYSTEM_LIST[*]}"

          # The highest release tag, <prefix>X.Y.Z. The prefix holds only literal characters once
          # its dots are escaped.
          PREFIX_RE=${TAG_PREFIX//./\\.}
          if ! REFS=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/$TAG_PREFIX"); then
            fail "Could not list the tags. Nothing was released; re-run once the API answers."
          fi
          if ! TAGS=$(jq -s -r --arg re "^refs/tags/${PREFIX_RE}(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" '
            if all(.[]; type == "array") then (add // []) else error("not a list of refs") end
            | .[] | .ref | select(type == "string" and test($re)) | ltrimstr("refs/tags/")' <<<"$REFS"); then
            fail "The tag list is malformed. Nothing was released."
          fi
          if [ -z "$TAGS" ]; then
            skip "There is no ${TAG_PREFIX}X.Y.Z release yet: the first release is dispatched by hand."
          fi
          LAST=$(while read -r tag; do printf '%s\n' "${tag#"$TAG_PREFIX"}"; done <<<"$TAGS" | sort -V | tail -n1)
          LAST_TAG="$TAG_PREFIX$LAST"
          IFS=. read -r MAJOR MINOR PATCH <<<"$LAST"
          VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          TAG="$TAG_PREFIX$VERSION"

          # The commits since that release. The API lists at most 250 commits in one comparison.
          if ! COMPARE=$(gh api "repos/$REPO/compare/$LAST_TAG...$SHA"); then
            fail "Could not compare $LAST_TAG...$SHA. Nothing was released; re-run once the API answers."
          fi
          if ! STATUS=$(jq -er '.status | select(type == "string")' <<<"$COMPARE"); then
            fail "The comparison $LAST_TAG...$SHA is malformed. Nothing was released."
          fi
          case "$STATUS" in
          ahead) ;;
          identical)
            # A re-run of the run that released it: simple-tag-and-release is idempotent, so it
            # finishes whatever the first run left undone (the moving vMAJOR and latest tags).
            echo "$SHA is already the release $LAST_TAG: finishing it, in case a step after the tag failed."
            {
              echo "authorized=true"
              echo "reconcile=true"
              echo "version=$LAST"
              echo "tag=$LAST_TAG"
            } >> "$GITHUB_OUTPUT"
            exit 0
            ;;
          behind) skip "$SHA is older than the release $LAST_TAG: nothing to release." ;;
          *) fail "The release $LAST_TAG is not an ancestor of $SHA ($STATUS). Nothing was released; it needs a human." ;;
          esac

          # One line per commit: sha, parent count, then what decides it. The subject is last, as it
          # may hold anything but a newline. A breaking-change footer anywhere in the message counts.
          if ! COMMITS=$(jq -er --arg bot "$BOT" '
            if (.commits | type) != "array" or (.total_commits | type) != "number" then error("no commit list")
            elif (.commits | length) != .total_commits then error("truncated")
            else . end
            | .commits[]
            | if (.sha | type) != "string" or (.sha | test("^[0-9a-f]{40}$") | not) or (.parents | type) != "array"
              then error("a commit without a sha or parents") else . end
            | [ .sha,
                (.parents | length | tostring),
                (.parents[1].sha // "-"),
                # Dependabot commits are created by GitHub: committer web-flow, signed with
                # the GitHub key. A commit pushed from a clone with Dependabot as its author is not.
                (if .author.login == $bot and .author.type == "Bot" and .committer.login == "web-flow"
                 then "bot" else "other" end),
                (if .commit.verification.verified == true then "verified" else "unverified" end),
                (if (.commit.message // "") | test("(^|\n)BREAKING[ -]CHANGE:") then "breaking" else "-" end),
                (.commit.message // "" | split("\n")[0])
              ] | join(" ")' <<<"$COMPARE"); then
            fail "The commit list of $LAST_TAG...$SHA is malformed or truncated (more than 250 commits?). Nothing was released."
          fi

          # A merge commit must be the merge of a Dependabot pull request, from its own head.
          dependabot_merge() {
            local sha=$1 head=$2 list numbers number pr attempt
            list=$(mktemp)
            numbers=""
            for ((attempt = 1; attempt <= ATTEMPTS; attempt++)); do
              if ! gh api --paginate "repos/$REPO/commits/$sha/pulls?per_page=100" >"$list"; then
                fail "Could not list the pull requests of $sha. Nothing was released; re-run once the API answers."
              fi
              if ! numbers=$(jq -s -r --arg sha "$sha" '
                if all(.[]; type == "array") then (add // []) else error("not a list of pull requests") end
                | .[] | select(type == "object" and .merge_commit_sha == $sha) | .number
                | if type == "number" then . else error("no number") end' "$list"); then
                fail "The pull request list of $sha is malformed. Nothing was released."
              fi
              if [ -n "$numbers" ] || [ "$attempt" -eq "$ATTEMPTS" ]; then
                break
              fi
              echo "No pull request is associated with $sha yet; reading again in ${DELAY}s."
              sleep "$DELAY"
            done
            for number in $numbers; do
              if ! pr=$(gh api "repos/$REPO/pulls/$number"); then
                fail "Could not read pull request #$number. Nothing was released; re-run once the API answers."
              fi
              if jq -e --arg sha "$sha" --arg head "$head" --arg repo "$REPO" --arg base "$DEFAULT_BRANCH" --arg bot "$BOT" '
                type == "object"
                and .merged == true and .merge_commit_sha == $sha
                and .user.login == $bot and .user.type == "Bot"
                and .head.repo.full_name == $repo and (.head.ref | type == "string" and startswith("dependabot/"))
                and .head.sha == $head
                and .base.repo.full_name == $repo and .base.ref == $base' <<<"$pr" >/dev/null; then
                echo "  $sha: the merge of Dependabot's pull request #$number"
                return 0
              fi
            done
            return 1
          }

          FIXES=0
          while read -r sha parents second author verified breaking subject; do
            if [ "$breaking" = breaking ] || [[ "$subject" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
              skip "$sha ('$subject') is a breaking change. Dispatch the release by hand."
            fi
            if [ "$parents" = 1 ]; then
              if [ "$author" != bot ] || [ "$verified" != verified ]; then
                skip "$sha ('$subject') is not a verified commit by $BOT, committed by GitHub: $LAST_TAG...$SHA holds more than Dependabot's work. Dispatch the release by hand."
              fi
              if [[ "$subject" =~ ^fix(\([^\)]*\))?: ]]; then
                FIXES=$((FIXES + 1))
              fi
              echo "  $sha: $subject"
            elif [ "$parents" = 2 ]; then
              if ! dependabot_merge "$sha" "$second"; then
                skip "$sha ('$subject') is not the merge of a Dependabot pull request from its head: $LAST_TAG...$SHA holds more than Dependabot's work. Dispatch the release by hand."
              fi
            else
              skip "$sha has $parents parents, so it is no Dependabot merge. Dispatch the release by hand."
            fi
          done <<<"$COMMITS"

          # What ships, whoever wrote it: the authorship checks above rest on GitHub's attribution,
          # which a commit can borrow (a verified signature authenticates the committer, not the
          # author). So the whole change since the release must be what Dependabot's updates are:
          # modified files whose every change block (a run of removed and added lines with no
          # unchanged line inside) replaces lines one for one, each removed line with an added one
          # that is the same line but for its ref: a `uses:` pin moving to another full
          # SHA (same action, same place, a new version comment), or a hook's `rev:` in
          # .pre-commit-config.yaml (which ships nothing, but sits unreleased beside the pins). An
          # added or removed step, or another action, is a human's change.
          #
          # Each ecosystem in ECOSYSTEMS adds its files, by name:
          #   docker  a Dockerfile's FROM line, the same but for its tag and digest, one for one;
          #           both sides name a tag or a digest, and a digest is never dropped
          #   cargo   Cargo.toml: a dependency's version requirement, one for one; Cargo.lock
          #   gomod   go.mod and go.sum
          #   npm     package.json: a dependency's version, one for one; package-lock.json
          # A lockfile (and go.mod, which gains indirect requirements) cannot be paired line by
          # line, so each of its changed lines must be one a version update writes: a package,
          # version, checksum or crates.io source in Cargo.lock; a requirement on a module path
          # with a dot, `go` or `toolchain` in go.mod (no replace); a hash in go.sum. In
          # package-lock.json removed lines are free (they name nothing to fetch) and each added
          # one is a known key with a plain value, no backslash (a JSON escape could spell
          # another key), no `name` (an alias), `link`, `bin` path or `hasInstallScript`, and a
          # `resolved` is exactly registry.npmjs.org's tarball of its own entry's name and
          # version. So a dependency can move to another version from its registry, never to
          # another source or another package.
          if ! BAD=$(jq -r --arg ecosystems "$ECOSYSTEMS" \
            --arg pin '^[+-](?<same>\s*(-\s+)?uses:\s*["\x27]?[^@\s"\x27]+@)[0-9a-f]{40}["\x27]?(\s+#.*)?$' \
            --arg rev '^[+-](?<same>\s*rev:\s*)\S+(\s+#.*)?$' \
            --arg from '^[+-](?<same>FROM\s+(--platform=\S+\s+)?[a-z0-9][a-z0-9._/-]*(:[0-9]+/[a-z0-9._/-]+)?)(?<tag>:[A-Za-z0-9_][A-Za-z0-9_.-]*)?(?<digest>@sha256:[0-9a-f]{64})?(?<rest>(\s+AS\s+[A-Za-z0-9_.-]+)?\s*)$' \
            --arg cargo '^[+-](?<same>\s*"?[A-Za-z0-9_.-]+"?\s*=\s*(\{[^"]*\bversion\s*=\s*)?)"(?<req>[^"]*)"(?<rest>.*)$' \
            --arg creq '^([\^~=]|[<>]=?)?[0-9]+(\.([0-9]+|\*)){0,2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' \
            --arg npm '^[+-](?<same>\s*"[^"]+":\s*)"(?<req>[^"]*)"(?<rest>,?\s*)$' \
            --arg nreq '^([\^~=]|[<>]=?)?v?[0-9]+(\.([0-9]+|x|\*)){0,2}(-[0-9A-Za-z.-]+)?$' \
            --arg cargolock '^[+-](\[\[package\]\]|name = "[A-Za-z0-9_.-]+"|version = ("[0-9A-Za-z.+-]+"|[0-9]+)|source = "registry\+https://github\.com/rust-lang/crates\.io-index"|checksum = "[0-9a-f]{64}"|dependencies = \[|\s+"[A-Za-z0-9_.+ -]+( \(registry\+https://github\.com/rust-lang/crates\.io-index\))?",|\]|)$' \
            --arg gomod '^[+-](\s*(require\s+)?[A-Za-z0-9-]+\.[A-Za-z0-9.-]+(/[A-Za-z0-9._~-]+)*\s+v[0-9][0-9A-Za-z.+-]*(\s+// indirect)?|go [0-9]+(\.[0-9]+){1,2}|toolchain go[0-9]+(\.[0-9]+){1,2}|require \(|\)|\s*)$' \
            --arg gosum '^[+-][A-Za-z0-9!-]+\.[A-Za-z0-9.!-]+(/[A-Za-z0-9._~!-]+)* v[0-9][0-9A-Za-z.+-]*(/go\.mod)? h1:[A-Za-z0-9+/]{43}=$' \
            --arg npmkey '^\s*"node_modules/(.*/node_modules/)?(?<name>(@[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]+)": \{$' \
            --arg npmver '^\s*"version": "(?<v>[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)",?$' \
            --arg npmres '^\s*"resolved": "(?<url>[^"]+)",?$' \
            --arg npmline '^\s*("[A-Za-z0-9@._/-]*": \{|"(os|cpu|libc|funding)": \[|[}\]],?|"(dev|optional|peer|devOptional)": true,?|"integrity": "sha(256|384|512)-[A-Za-z0-9+/]+=*",?|"license": "[A-Za-z0-9 .()+-]+",?|"(url|funding)": "https://[^" ]+",?|"type": "[A-Za-z]+",?|"deprecated": "[^"]*",?|"[A-Za-z0-9_!-]+",?|"[A-Za-z0-9@._/-]+": "[\^~<>=]*\s*v?[0-9xX*][0-9A-Za-z.*+ |<>=^~-]*",?)$' '
            ($ecosystems | split(" ") | map(select(. != ""))) as $ecos
            | def eco($e): $ecos | index($e) != null;
            # How a file is checked: one for one with a kept part ("pin", "pre-commit", "docker",
            # "cargo", "npm"), or line by line ("Cargo.lock", "go.mod", "go.sum", "npm-lock").
            def mode:
              (split("/") | last) as $base
              | if . == ".pre-commit-config.yaml" then "pre-commit"
                elif eco("docker") and ($base | test("^(Dockerfile|Containerfile)([.-][^/]*)?$|\\.(Dockerfile|Containerfile)$")) then "docker"
                elif eco("cargo") and $base == "Cargo.toml" then "cargo"
                elif eco("cargo") and $base == "Cargo.lock" then "Cargo.lock"
                elif eco("gomod") and $base == "go.mod" then "go.mod"
                elif eco("gomod") and $base == "go.sum" then "go.sum"
                elif eco("npm") and $base == "package.json" then "npm"
                elif eco("npm") and $base == "package-lock.json" then "npm-lock"
                else "pin" end;
            # A version requirement, kept with everything around it, or null.
            def requirement($re; $req):
              if test($re) then capture($re) | if (.req | test($req)) then .same + "\u0000" + .rest else null end
              else null end;
            # Whether a changed line of a line-by-line file is one a version update writes.
            def line_ok($mode):
              if $mode == "Cargo.lock" then test($cargolock)
              elif $mode == "go.mod" then test($gomod)
              else test($gosum) end;
            # package-lock.json, line by line in order: the first added line that is not one a
            # version update writes, or null. The entry (its node_modules key and version) is read
            # from the new side, context included, and forgotten at each hunk header.
            def npm_lock_bad:
              reduce split("\n")[] as $line ({name: null, version: null, bad: null};
                if .bad != null or ($line | startswith("-")) then .
                elif ($line | startswith("@@")) then .name = null | .version = null
                else ($line[1:]) as $c
                  | (if ($c | test($npmkey)) then .name = ($c | capture($npmkey).name) | .version = null
                     elif ($c | test($npmver)) then .version = ($c | capture($npmver).v)
                     else . end)
                  | if ($line | startswith("+") | not) then .
                    elif ($c | contains("\\")) then .bad = $line
                    elif ($c | test("^\\s*\"resolved\":")) then
                      if .name != null and .version != null and ($c | test($npmres))
                        and ($c | capture($npmres).url)
                          == "https://registry.npmjs.org/\(.name)/-/\(.name | split("/") | last)-\(.version).tgz"
                      then . else .bad = $line end
                    elif ($c | test($npmkey)) or ($c | test($npmver)) or ($c | test($npmline)) then .
                    else .bad = $line end
                end)
              | .bad;
            if (.files | type) != "array" then error("no file list")
            elif (.files | length) >= 300 then error("300 or more files: the list may be truncated")
            else . end
            | .files[]
            | if type != "object" or (.filename | type) != "string" then error("a file without a name")
              elif .status != "modified" then "\(.filename | tojson) (\(.status // "?"), not modified)"
              elif (.patch | type) != "string" then "\(.filename | tojson) (no patch: binary or too large)"
              else .filename as $file
                | ($file | mode) as $mode
                # What a changed line must keep: everything but the ref and its comment.
                | def kept:
                    if $mode == "docker" then
                      (if test($from) then capture($from)
                         | if .tag == null and .digest == null then null
                           else "from " + .same + "\u0000" + .rest + "\u0000" + (.digest != null | tostring) end
                       else null end)
                    elif $mode == "cargo" then (requirement($cargo; $creq) | if . then "cargo " + . else null end)
                    elif $mode == "npm" then (requirement($npm; $nreq) | if . then "npm " + . else null end)
                    elif test($pin) then "uses " + (capture($pin).same)
                    elif $mode == "pre-commit" and test($rev) then "rev " + (capture($rev).same)
                    else null end;
                if $mode == "npm-lock" then
                  (.patch | npm_lock_bad) as $bad
                  | if $bad != null then "\($file | tojson): \($bad | tojson)" else empty end
                elif ($mode | IN("Cargo.lock", "go.mod", "go.sum")) then
                  [ .patch | split("\n")[] | select(test("^[+-]") and (line_ok($mode) | not))
                    | "\($file | tojson): \(tojson)" ] | .[0] // empty
                else
                # Change blocks: any line that is not a removal or an addition (context, a hunk header,
                # "\ No newline") ends one, so no pair crosses an unchanged line.
                [ .patch | split("\n")
                  | reduce .[] as $line ({blocks: [], cur: null};
                      if ($line | test("^[+-]")) then
                        .cur = ((.cur // {removed: [], added: []})
                          | if ($line | startswith("-")) then .removed += [$line] else .added += [$line] end)
                      else
                        (if .cur != null then .blocks += [.cur] else . end) | .cur = null
                      end)
                  | .blocks + (if .cur != null then [.cur] else [] end)
                  | .[]
                  | .removed as $removed
                  | .added as $added
                  | if ($removed | length) != ($added | length) then
                      "\($file | tojson): \($removed | length) line(s) removed, \($added | length) added"
                    else
                      range($removed | length) as $i
                      | ($removed[$i] | kept) as $old
                      | if $old == null or $old != ($added[$i] | kept) then
                          "\($file | tojson): \($removed[$i] | tojson) -> \($added[$i] | tojson)"
                        else empty end
                    end ]
                | .[0] // empty
                end
              end' <<<"$COMPARE"); then
            fail "The file list of $LAST_TAG...$SHA is malformed or incomplete. Nothing was released."
          fi
          if [ -n "$BAD" ]; then
            skip "$LAST_TAG...$SHA changes more than Dependabot's updates do: $(head -n1 <<<"$BAD"). Dispatch the release by hand."
          fi

          if [ "$FIXES" -eq 0 ]; then
            skip "Only Dependabot's work since $LAST_TAG, but none of it is a fix: nothing that ships."
          fi
          echo "Everything since $LAST_TAG is Dependabot's, with $FIXES fix commit(s): release $TAG once CI passes on $SHA."
          {
            echo "authorized=true"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  # The tag is never created before the default branch's CI passed on this exact commit.
  ci:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # require-ci-green reads the CI runs.
      actions: read
      # git/ref/heads/<default branch>.
      contents: read
    outputs:
      release: ${{ steps.mark.outputs.release }}
      version: ${{ steps.mark.outputs.version }}
      tag: ${{ steps.mark.outputs.tag }}
    steps:
      - name: Wait for CI to pass on the pushed commit
        uses: leinardi/gh-composite-actions/require-ci-green@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          sha: ${{ github.sha }}
          workflow: .github/workflows/${{ inputs.ci_workflow }}
          accepted-events: push
          default-branch: ${{ github.event.repository.default_branch }}

      # A newer push to the default branch has its own run, which covers this commit too: two runs
      # releasing would race, and the older one's version would no longer be the highest. A release
      # being finished has its version already, so it goes on either way.
      - name: Mark the release, unless the default branch moved on
        id: mark
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.authorize.outputs.version }}
          TAG: ${{ needs.authorize.outputs.tag }}
          RECONCILE: ${{ needs.authorize.outputs.reconcile }}
        run: |
          set -euo pipefail
          if [ "$RECONCILE" = true ]; then
            echo "Finishing the release $TAG."
            {
              echo "release=true"
              echo "version=$VERSION"
              echo "tag=$TAG"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! HEAD=$(gh api "repos/$REPO/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha'); then
            echo "Could not read the head of $DEFAULT_BRANCH. Nothing was released; re-run once the API answers." >&2
            exit 1
          fi
          if [ "$HEAD" != "$SHA" ]; then
            echo "::notice title=No Dependabot release::$DEFAULT_BRANCH moved on to $HEAD; that push's run decides the release."
            exit 0
          fi
          echo "Everything unreleased is Dependabot's and CI is green: release $TAG."
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

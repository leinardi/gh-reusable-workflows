name: Release (reusable)

# Resolves a release version (explicit, or derived from the Conventional Commits
# since the last release by svu), then reconciles the GitHub release for it:
# draft, assets, publish, and, for the default `v` prefix, the moving `vMAJOR` /
# `latest` tags. Every step is idempotent, so re-running a failed run finishes
# what it started.
#
# Release tags are immutable in the repositories that call this ("Immutable
# tags" ruleset: no update, no deletion), so nothing here creates a tag and
# deletes it on failure. The tag is created by publishing the draft, which is
# the last irreversible step; everything that can fail runs before it.
#
# The version is resolved by the release-version action of
# leinardi/gh-composite-actions, which carries its own tests. The inline scripts
# here are tested by scripts/test-simple-tag-and-release.sh, which extracts them
# from this file with yq. Keep each one self-contained: it reads its inputs from
# env only.
on:
  workflow_call:
    inputs:
      version:
        description: "Version, e.g. 1.2.0, v1.2.0 or <tag_prefix>1.2.0 (empty: derive from the commits since the last release)"
        type: string
        required: false
        default: ""
      semver:
        description: "Deprecated alias of `version`, kept for existing callers"
        type: string
        required: false
        default: ""
      tag_prefix:
        description: "Text before X.Y.Z in a release tag: `v` for vX.Y.Z, `<plugin>--v` for <plugin>--vX.Y.Z. Only `v` moves the vMAJOR and latest tags."
        type: string
        required: false
        default: "v"
      dry_run:
        description: "Resolve the version and print the plan; write nothing"
        type: boolean
        required: false
        default: false
      artifact_name:
        description: "Name of an artifact uploaded earlier in the calling run; its files are attached to the release"
        type: string
        required: false
        default: ""
    outputs:
      version:
        description: "The released (or, on a dry run, the resolved) release tag, <tag_prefix>X.Y.Z: vX.Y.Z for the default prefix"
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: "The same release tag, <tag_prefix>X.Y.Z, under a name that says what it is"
        value: ${{ jobs.release.outputs.version }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Creating the release and its tag, and moving vMAJOR / latest.
    permissions:
      contents: write
    # One release per repository at a time, never cancelled: two runs in flight
    # would both pass "higher than every released version" and could publish in
    # the wrong order.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.resolve.outputs.tag }}

    steps:
      # workflow_dispatch lets the caller pick any branch. A release is cut from
      # the default branch only; this fails rather than skips, so a run from
      # elsewhere is red, not a green no-op.
      - name: Refuse to release anything but the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "A release runs from the default branch (${DEFAULT_BRANCH:-unknown}) only, got $REF. Nothing was changed." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # svu reads the tags and the commits since the last one.
          fetch-depth: 0
          fetch-tags: true
          # Nothing is pushed with git: the release, its tag and the moving tags
          # go through the API. The two steps that read the remote's tags get a
          # credential of their own (GIT_CONFIG_* below).
          persist-credentials: false

      - name: Install svu
        uses: leinardi/gh-composite-actions/setup-svu@73fdb81c6cb1d2a3ea7c669e3bc136538e0f4ffa # v1.0.0

      # The release-version action knows `version` only. This keeps the
      # deprecated `semver` alias working: the two may both be set only to the
      # same version. It also checks the prefix and builds the one tag regex the
      # later steps filter every tag lookup through.
      - name: Pick the version input and the tag regex
        id: input
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SEMVER: ${{ inputs.semver }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail

          # The same rule as release-version: with only these characters the
          # prefix is literal in a regex once its dots are escaped.
          if [ -z "$TAG_PREFIX" ] || ! [[ "$TAG_PREFIX" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "tag_prefix '$TAG_PREFIX' must be non-empty and hold only letters, digits and '.', '_', '/', '-'. Nothing was changed." >&2
            exit 1
          fi

          # A version input without its prefix, or without a bare leading v.
          bare() {
            if [[ "$1" == "$TAG_PREFIX"* ]]; then
              printf '%s' "${1#"$TAG_PREFIX"}"
            else
              printf '%s' "${1#v}"
            fi
          }
          if [ -n "$INPUT_VERSION" ] && [ -n "$INPUT_SEMVER" ] \
            && [ "$(bare "$INPUT_VERSION")" != "$(bare "$INPUT_SEMVER")" ]; then
            echo "Both version ($INPUT_VERSION) and the deprecated semver ($INPUT_SEMVER) are set, and they differ. Pass only version. Nothing was changed." >&2
            exit 1
          fi

          # <prefix>MAJOR.MINOR.PATCH, strict SemVer core with no leading zeros,
          # no pre-release and no build metadata: the one definition of a release
          # tag. Every tag lookup filters through this, never through a glob.
          REGEX="^${TAG_PREFIX//./\\.}(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\$"
          {
            echo "version=${INPUT_VERSION:-$INPUT_SEMVER}"
            echo "tag_regex=$REGEX"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the version to release
        id: resolve
        uses: leinardi/gh-composite-actions/release-version@73fdb81c6cb1d2a3ea7c669e3bc136538e0f4ffa # v1.0.0
        with:
          version: ${{ steps.input.outputs.version }}
          tag-prefix: ${{ inputs.tag_prefix }}

      - name: Download the release assets
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/release-assets

      # Draft, assets, publish. Each state a previous run can leave behind has
      # its own branch, so a re-run finishes it:
      #   no release          -> create a draft, upload, publish
      #   draft               -> check its target, upload what is missing, publish
      #   published           -> check the tag, upload what is missing, no re-publish
      # A same-name asset whose content differs is never replaced: it fails.
      - name: Reconcile the GitHub release
        id: reconcile
        env:
          VERSION: ${{ steps.resolve.outputs.tag }}
          TARGET: ${{ github.sha }}
          RELEASE_TAG_REGEX: ${{ steps.input.outputs.tag_regex }}
          ASSETS_DIR: ${{ inputs.artifact_name != '' && format('{0}/release-assets', runner.temp) || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # git ls-remote of a private repository needs the token; the checkout
          # did not persist it. Git runs this helper with the step's env.
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { if [ "$1" = get ]; then echo username=x-access-token; echo "password=$GH_TOKEN"; fi; }; f'
        run: |
          set -euo pipefail

          # The names of the remote's tags, from `git ls-remote --tags --refs`.
          tag_names() { awk '{ sub(/^refs\/tags\//, "", $2); print $2 }' <<<"$1"; }

          # The highest strict release on the remote, counting $VERSION itself.
          # Its own assignment, so a failed ls-remote stops the step instead of
          # reading as "no tags".
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST=$({ tag_names "$REMOTE_TAGS"; echo "$VERSION"; } \
            | { grep -E "$RELEASE_TAG_REGEX" || true; } | sort -V | tail -n1)
          IS_LATEST=false
          if [ "$HIGHEST" = "$VERSION" ]; then
            IS_LATEST=true
          fi

          # The commit the remote tag points at, peeled, or nothing.
          remote_tag_sha() {
            local out
            out=$(git ls-remote --tags origin "refs/tags/$1" "refs/tags/$1^{}")
            awk -v p="refs/tags/$1^{}" '$2 == p {print $1; found=1} END {if (!found) exit 1}' <<<"$out" \
              || awk -v t="refs/tags/$1" '$2 == t {print $1}' <<<"$out"
          }

          TAG_SHA=$(remote_tag_sha "$VERSION")
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$TARGET" ]; then
            echo "The tag $VERSION already exists on $TAG_SHA, not on this commit ($TARGET). Nothing was changed; it needs a human." >&2
            exit 1
          fi

          # Release state: none, draft or published.
          STATE=none
          if OUT=$(gh release view "$VERSION" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' 2>&1); then
            IFS=$'\t' read -r IS_DRAFT DRAFT_TARGET <<<"$OUT"
            if [ "$IS_DRAFT" = "true" ]; then
              STATE=draft
              if [ "$DRAFT_TARGET" != "$TARGET" ]; then
                echo "The draft release $VERSION targets $DRAFT_TARGET, not this commit ($TARGET). Nothing was changed; it needs a human." >&2
                exit 1
              fi
            else
              STATE=published
              if [ -z "$TAG_SHA" ]; then
                echo "The release $VERSION is published but its tag is missing. Nothing was changed; it needs a human." >&2
                exit 1
              fi
            fi
          elif ! grep -qi 'release not found' <<<"$OUT"; then
            echo "Could not tell whether the release $VERSION exists: $OUT" >&2
            exit 1
          fi
          if [ "$STATE" = "none" ] && [ -n "$TAG_SHA" ]; then
            echo "The tag $VERSION exists on this commit with no release: the release will be created on it."
          fi

          EXPECTED=()
          if [ -n "$ASSETS_DIR" ]; then
            # A release holds a flat list of files. Anything nested in the artifact
            # would be left out silently, so it fails instead.
            NESTED=$(find "$ASSETS_DIR" -mindepth 1 ! -type f -print -quit)
            if [ -z "$NESTED" ]; then
              NESTED=$(find "$ASSETS_DIR" -mindepth 2 -print -quit)
            fi
            if [ -n "$NESTED" ]; then
              echo "The artifact holds '${NESTED#"$ASSETS_DIR"/}', which is not a top-level file. Upload a flat list of files to attach." >&2
              exit 1
            fi
            mapfile -t EXPECTED < <(find "$ASSETS_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)
            if [ "${#EXPECTED[@]}" -eq 0 ]; then
              echo "The artifact holds no files to attach." >&2
              exit 1
            fi
          fi

          PUBLISHED=()
          if [ "$STATE" != "none" ]; then
            NAMES=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
            if [ -n "$NAMES" ]; then
              mapfile -t PUBLISHED <<<"$NAMES"
            fi
          fi
          expected() { printf '%s\n' "${EXPECTED[@]}" | grep -qxF "$1"; }
          published() { printf '%s\n' "${PUBLISHED[@]}" | grep -qxF "$1"; }

          for name in "${PUBLISHED[@]}"; do
            if ! expected "$name"; then
              echo "The release $VERSION carries an unexpected asset '$name'. Nothing was changed; it needs a human." >&2
              exit 1
            fi
          done

          DOWNLOADS=$(mktemp -d)
          MISSING=()
          for name in "${EXPECTED[@]}"; do
            if published "$name"; then
              gh release download "$VERSION" --pattern "$name" --dir "$DOWNLOADS"
              REMOTE_SUM=$(sha256sum "$DOWNLOADS/$name" | awk '{print $1}')
              LOCAL_SUM=$(sha256sum "$ASSETS_DIR/$name" | awk '{print $1}')
              if [ "$REMOTE_SUM" != "$LOCAL_SUM" ]; then
                echo "The published $name ($REMOTE_SUM) differs from this run's ($LOCAL_SUM). Nothing was replaced; it needs a human." >&2
                exit 1
              fi
            else
              MISSING+=("$name")
            fi
          done

          echo "Plan for $VERSION: release state '$STATE', tag ${TAG_SHA:-absent}, target $TARGET, latest=$IS_LATEST, assets to upload: ${MISSING[*]:-none}."
          {
            echo "state=$STATE"
            echo "is_latest=$IS_LATEST"
            echo "uploaded=${MISSING[*]}"
          } >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing was changed."
            exit 0
          fi

          if [ "$STATE" = "none" ]; then
            gh release create "$VERSION" --draft --target "$TARGET" --title "$VERSION" --generate-notes --latest="$IS_LATEST"
            STATE=draft
          fi
          for name in "${MISSING[@]}"; do
            gh release upload "$VERSION" "$ASSETS_DIR/$name"
          done
          if [ "$STATE" = "draft" ]; then
            # Publishing creates the tag on the target: the point of no return.
            gh release edit "$VERSION" --draft=false --latest="$IS_LATEST"
          fi

          TAG_SHA=$(remote_tag_sha "$VERSION")
          if [ "$TAG_SHA" != "$TARGET" ]; then
            echo "After publishing, the tag $VERSION points at '${TAG_SHA:-nothing}', not at $TARGET. It needs a human." >&2
            exit 1
          fi

          # GitHub's "Latest" badge follows the highest release, never a recovery
          # of an older one. make_latest=false cannot take the badge away, so a
          # wrong badge is fixed by marking the highest release instead. Only
          # "no latest release" (HTTP 404) reads as none; any other error fails,
          # and a re-run finishes from here.
          ERR=$(mktemp)
          if ! CURRENT_LATEST=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>"$ERR"); then
            if ! grep -q 'HTTP 404' "$ERR"; then
              cat "$ERR" >&2
              echo "Could not read which release carries the Latest badge. $VERSION is published; re-run to finish." >&2
              exit 1
            fi
            CURRENT_LATEST=""
          fi
          if [ "$IS_LATEST" = "true" ] && [ "$CURRENT_LATEST" != "$VERSION" ]; then
            gh release edit "$VERSION" --latest
          elif [ "$IS_LATEST" != "true" ] && [ "$CURRENT_LATEST" = "$VERSION" ]; then
            gh release edit "$HIGHEST" --latest \
              || echo "::warning::$VERSION carries the Latest badge but $HIGHEST is higher, and $HIGHEST could not be marked Latest. Mark it by hand."
          fi

      # The moving tags go last, after a fresh look at the remote: a version that
      # is not the highest overall does not take `latest`, and one that is not
      # the highest of its major does not take `vMAJOR`. Recovering an older
      # release therefore leaves both where they are.
      #
      # Only the default `v` prefix has moving tags. Another prefix moves none:
      # `latest` is one tag per repository, so two prefixes would fight over it,
      # and the "Immutable tags" ruleset exempts only `v<N>` and `latest`, so a
      # `<prefix>MAJOR` could be created once and then never moved.
      - name: Move the major and latest tags
        id: aliases
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.resolve.outputs.tag }}
          MAJOR: ${{ steps.resolve.outputs.major }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          TARGET: ${{ github.sha }}
          RELEASE_TAG_REGEX: ${{ steps.input.outputs.tag_regex }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { if [ "$1" = get ]; then echo username=x-access-token; echo "password=$GH_TOKEN"; fi; }; f'
        run: |
          set -euo pipefail
          if [ "$TAG_PREFIX" != "v" ]; then
            echo "::notice::The tag prefix is '$TAG_PREFIX', not 'v': no vMAJOR or latest tag is moved."
            echo "moved=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          RELEASES=$(awk '{ sub(/^refs\/tags\//, "", $2); print $2 }' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || true; })
          HIGHEST=$(sort -V <<<"$RELEASES" | tail -n1)
          HIGHEST_IN_MAJOR=$(MAJOR_DOT="$MAJOR." awk 'index($0, ENVIRON["MAJOR_DOT"]) == 1' <<<"$RELEASES" | sort -V | tail -n1)

          # Points refs/tags/$1 at $TARGET: update in place, or create it. Whether
          # it exists comes from the listing above, not from a probe whose error
          # could read as "absent".
          move() {
            if awk -v r="refs/tags/$1" '$2 == r { found = 1 } END { exit !found }' <<<"$REMOTE_TAGS"; then
              gh api -X PATCH "repos/$REPO/git/refs/tags/$1" -f sha="$TARGET" -F force=true >/dev/null
            else
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$1" -f sha="$TARGET" >/dev/null
            fi
            echo "Moved $1 to $TARGET ($VERSION)."
          }

          MOVED=()
          if [ "$HIGHEST_IN_MAJOR" = "$VERSION" ]; then
            move "$MAJOR"
            MOVED+=("$MAJOR")
          else
            echo "::notice::$HIGHEST_IN_MAJOR is the highest $MAJOR release, so $MAJOR was left where it is."
          fi
          if [ "$HIGHEST" = "$VERSION" ]; then
            move latest
            MOVED+=(latest)
          else
            echo "::notice::$HIGHEST is the highest release, so latest was left where it is."
          fi
          echo "moved=${MOVED[*]}" >> "$GITHUB_OUTPUT"

      - name: Summarize
        if: always() && steps.resolve.outputs.tag != ''
        env:
          VERSION: ${{ steps.resolve.outputs.tag }}
          PREVIOUS: ${{ steps.resolve.outputs.previous }}
          EXPLICIT: ${{ steps.resolve.outputs.explicit }}
          RECOVERY: ${{ steps.resolve.outputs.recovery }}
          STATE: ${{ steps.reconcile.outputs.state }}
          IS_LATEST: ${{ steps.reconcile.outputs.is_latest }}
          UPLOADED: ${{ steps.reconcile.outputs.uploaded }}
          MOVED: ${{ steps.aliases.outputs.moved }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "# Dry run: $VERSION"
            else
              echo "# Release $VERSION"
            fi
            echo
            echo "- Previous release: ${PREVIOUS:-none}; explicit version: $EXPLICIT; recovery: $RECOVERY"
            echo "- Release state found: ${STATE:-unknown}; marked latest: ${IS_LATEST:-unknown}"
            echo "- Assets uploaded: ${UPLOADED:-none}"
            echo "- Tags moved: ${MOVED:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
